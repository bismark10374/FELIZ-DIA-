<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Día de la Mujer Boliviana, Mayoli! ✨</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;700;800;900&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0b0914;
            overflow-x: hidden;
            color: #f3f4f6;
        }

        h1, .font-heading {
            font-family: 'Outfit', sans-serif;
        }

        .font-serif-italic {
            font-family: 'Playfair Display', serif;
        }

        /* Glassmorphism Card Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 35px rgba(236, 72, 153, 0.2);
        }

        /* Animated Gradient Border */
        .gradient-border {
            position: relative;
            border-radius: 2rem;
        }

        .gradient-border::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #ec4899, #a855f7, #fbbf24, #ec4899);
            background-size: 300%;
            z-index: -1;
            border-radius: 2.1rem;
            animation: borderGlow 8s linear infinite;
            opacity: 0.85;
            filter: blur(6px);
        }

        @keyframes borderGlow {
            0% { background-position: 0 0; }
            50% { background-position: 300% 0; }
            100% { background-position: 0 0; }
        }

        /* Glow Button */
        .btn-glow {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
        }

        .btn-glow:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.7), 0 0 40px rgba(168, 85, 247, 0.5);
        }

        .btn-glow:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Float Animation for Flower */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }

        .floating-flower {
            animation: floatSlow 5s ease-in-out infinite;
        }

        /* Shimmer text effect */
        .shimmer-text {
            background: linear-gradient(90deg, #ffffff 0%, #f472b6 30%, #fbbf24 60%, #ffffff 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* Pulse aura behind flower */
        .flower-glow {
            animation: pulseAura 3s ease-in-out infinite alternate;
        }

        @keyframes pulseAura {
            0% { opacity: 0.4; transform: scale(0.95); }
            100% { opacity: 0.8; transform: scale(1.1); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 relative">

    <!-- Background Animated Canvas -->
    <canvas id="bgCanvas" class="fixed top-0 left-0 w-full h-full pointer-events-none z-0"></canvas>

    <!-- Ambient Glows -->
    <div class="fixed top-1/4 left-1/3 w-80 h-80 bg-pink-600/20 rounded-full filter blur-[120px] pointer-events-none"></div>
    <div class="fixed bottom-1/4 right-1/3 w-80 h-80 bg-purple-600/20 rounded-full filter blur-[120px] pointer-events-none"></div>

    <!-- Main Card Container -->
    <main class="relative z-10 w-full max-w-md mx-auto my-auto">
        <div id="tiltCard" class="glass-card gradient-border p-6 sm:p-8 rounded-[2rem] text-center relative overflow-hidden transition-all duration-300">
            
            <!-- Floral SVG Illustration -->
            <div class="relative w-28 h-28 mx-auto mb-3 flex items-center justify-center">
                <!-- Glowing Backdrop for Flower -->
                <div class="absolute inset-0 bg-gradient-to-tr from-pink-500/30 to-purple-500/30 rounded-full filter blur-md flower-glow"></div>
                
                <!-- Stylized Flower SVG -->
                <svg class="w-24 h-24 floating-flower relative z-10 drop-shadow-[0_0_12px_rgba(236,72,153,0.6)]" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Stem & Leaf -->
                    <path d="M50 68 C50 82, 54 88, 52 95" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>
                    <path d="M51 80 C60 76, 65 78, 62 84 C55 86, 52 82, 51 80 Z" fill="#10b981"/>
                    
                    <!-- Back Petals -->
                    <path d="M50 45 C30 25, 20 45, 42 52 Z" fill="#c084fc" opacity="0.85"/>
                    <path d="M50 45 C70 25, 80 45, 58 52 Z" fill="#c084fc" opacity="0.85"/>
                    
                    <!-- Main Petals -->
                    <path d="M50 48 C35 15, 10 35, 42 58 Z" fill="url(#petalGrad1)"/>
                    <path d="M50 48 C65 15, 90 35, 58 58 Z" fill="url(#petalGrad1)"/>
                    <path d="M50 48 C20 40, 25 75, 46 62 Z" fill="url(#petalGrad2)"/>
                    <path d="M50 48 C80 40, 75 75, 54 62 Z" fill="url(#petalGrad2)"/>
                    
                    <!-- Center Flower Bell -->
                    <path d="M43 45 C43 30, 57 30, 57 45 C58 58, 42 58, 43 45 Z" fill="#f43f5e"/>
                    <circle cx="50" cy="46" r="6" fill="#fbbf24"/>
                    <circle cx="50" cy="46" r="3" fill="#ffffff"/>
                    
                    <!-- Sparkles around flower -->
                    <circle cx="25" cy="25" r="1.5" fill="#fbbf24"/>
                    <circle cx="75" cy="28" r="2" fill="#f472b6"/>
                    <circle cx="78" cy="65" r="1.5" fill="#38bdf8"/>

                    <defs>
                        <linearGradient id="petalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#f472b6"/>
                            <stop offset="100%" stop-color="#e11d48"/>
                        </linearGradient>
                        <linearGradient id="petalGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#fb7185"/>
                            <stop offset="100%" stop-color="#9333ea"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>

            <!-- Title Section -->
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight shimmer-text mb-1">
                ¡Feliz Día de la Mujer Boliviana!
            </h1>
            
            <!-- Name Highlight -->
            <div class="mb-5">
                <span class="text-2xl sm:text-3xl font-black font-serif-italic text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-pink-300 to-amber-200 drop-shadow-sm tracking-wide">
                    Mayoli
                </span>
            </div>

            <!-- Short Main Message (Night appropriate & Casual) -->
            <div class="bg-black/30 rounded-2xl p-4 sm:p-5 border border-white/10 backdrop-blur-sm mb-5 text-slate-200 text-sm sm:text-base leading-relaxed">
                <p class="font-medium text-white/95">
                    ¡Muchas felicidades en tu día! Desearte que la hayas pasado súper bien hoy. 🙌✨
                </p>
            </div>

            <!-- Dynamic Interactive Message Box -->
            <div id="messageBox" class="hidden mb-5 p-4 rounded-xl bg-gradient-to-r from-purple-900/50 via-pink-900/40 to-purple-900/50 border border-pink-500/30 text-center transition-all duration-300">
                <i class="fa-solid fa-quote-left text-pink-400/60 text-lg block mb-1"></i>
                <p id="messageText" class="text-xs sm:text-sm font-medium text-pink-100 italic leading-snug"></p>
            </div>

            <!-- Single Interactive Action Button -->
            <div class="w-full">
                <button id="btnMessages" class="btn-glow w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-pink-500 via-purple-600 to-pink-500 bg-[length:200%_auto] text-white font-bold text-sm sm:text-base flex items-center justify-center gap-2.5 cursor-pointer border border-pink-300/30">
                    <i class="fa-solid fa-envelope-open-text text-amber-300"></i>
                    <span id="btnText">Mensajes ✨</span>
                </button>
            </div>

        </div>
    </main>

    <script>
        /* --- 1. Background Particle Canvas Animation --- */
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        });

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height + height;
                this.size = Math.random() * 2.5 + 0.8;
                this.speedY = Math.random() * 0.9 + 0.2;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.7 + 0.2;
                
                const colors = ['#f472b6', '#fbbf24', '#c084fc', '#ffffff', '#38bdf8'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX;

                if (this.y < -10) {
                    this.reset();
                    this.y = height + 10;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.min(Math.floor(width * 0.07), 70);
            for (let i = 0; i < count; i++) {
                const p = new Particle();
                p.y = Math.random() * height;
                particles.push(p);
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateCanvas);
        }

        initParticles();
        animateCanvas();


        /* --- 2. Interactive Messages List & Button Logic --- */
        const messages = [
            "\"Que nunca falten las risas y la buena vibra.\"",
            "\"Éxitos en tus proyectos y sobre todo en tus reuniones jaja\"",
            "\"Que tengas un excelente semana, y por favor ya no le falles a tu teacher\"",
            "\"Ya falta poco para Navida asi que ánimo ánimo.\"",
            "\"Que la buena energía te acompañe y ya no reniegues, bueno mmmm sabes que si si renega.\""
        ];

        const btnMessages = document.getElementById('btnMessages');
        const btnText = document.getElementById('btnText');
        const messageBox = document.getElementById('messageBox');
        const messageText = document.getElementById('messageText');
        let currentMsgIndex = -1;

        btnMessages.addEventListener('click', () => {
            // Pick next non-repeating message
            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * messages.length);
            } while (nextIndex === currentMsgIndex && messages.length > 1);

            currentMsgIndex = nextIndex;
            messageText.innerText = messages[currentMsgIndex];

            // Update button label
            btnText.innerText = "Siguiente mensaje ✨";

            // Reveal box with smooth animation
            messageBox.classList.remove('hidden');
            messageBox.style.opacity = '0';
            messageBox.style.transform = 'scale(0.95)';

            setTimeout(() => {
                messageBox.style.opacity = '1';
                messageBox.style.transform = 'scale(1)';
            }, 50);

            // Trigger flower & sparkle confetti explosion
            const scalar = 1.3;
            const flowerEmoji = confetti.shapeFromText({ text: '🌺', scalar });
            const sparkleEmoji = confetti.shapeFromText({ text: '✨', scalar });
            const petalEmoji = confetti.shapeFromText({ text: '🌸', scalar });

            confetti({
                particleCount: 25,
                spread: 60,
                origin: { y: 0.8 },
                colors: ['#ec4899', '#a855f7', '#fbbf24'],
                shapes: [flowerEmoji, sparkleEmoji, petalEmoji, 'circle'],
                scalar: 1.1
            });
        });
    </script>
</body>
</html>
